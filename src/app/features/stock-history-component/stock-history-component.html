<div class="history-column">

  <div class="chart-box">
    <h3>Storico Valore Magazzino</h3>
    <canvas id="stockHistoryChart"></canvas>
  </div>

  <div class="table-box">
    <h3>Dettagli Movimenti</h3>

    <table class="history-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Prodotto</th>
          <th>Quantità</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let m of movements">
          <td>{{ m.date | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ getProductName(m.productId) }}</td>
          <td>{{ m.quantity }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
