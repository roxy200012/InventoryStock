<div class="page px-4">

  <h3 class="mb-4">Movimenti</h3>

  <div class="filters mb-3">
    <button class="btn btn-sm btn-outline-secondary" (click)="filterByType('all')">Tutti</button>
    <button class="btn btn-sm btn-outline-success" (click)="filterByType('IN')">Carico</button>
    <button class="btn btn-sm btn-outline-danger" (click)="filterByType('OUT')">Scarico</button>
  </div>

  <div class="table-wrapper">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Data</th>
          <th>Prodotto</th>
          <th>Tipo</th>
          <th>Quantità</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of filtered">
          <td>{{ m.date |date:'dd/MM/yyyy HH:mm' }}
          </td>
          <td>{{ getProductName(m.productId) }}</td>
          <td>
            <span class="badge" [ngClass]="m.type === 'IN' ? 'bg-success' : 'bg-danger'">
              {{ m.type }}
            </span>
          </td>
          <td>{{ m.quantity }}</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
